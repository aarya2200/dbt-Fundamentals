version: 2

sources:
    - name: jaffle_shop
      description: This is a replica of the Postgres database used by our app
      database: raw
      schema: jaffle_shop
      tables:
          - name: customers
            description: RAW data, one record per customer.
            columns:
              - name: id
                description: primary key for customer's data
                tests:
                  - unique
                  - not_null
          - name: orders
            description: RAW data, one record per order. Includes cancelled and deleted orders. 
            columns:
              - name: id
                tests:
                  - unique
                  - not_null
